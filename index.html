<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JavaScript praktikos testas</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#fff;background:#111328}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#4732a8,#171831 55%,#0c0d18)}
.wrap{max-width:980px;margin:auto;padding:32px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}
.badge,.score{background:#ffffff18;border:1px solid #ffffff22;padding:10px 15px;border-radius:999px}
.card{background:#fff;color:#171728;border-radius:22px;padding:26px;box-shadow:0 18px 60px #0005}
h1{margin:0 0 8px}.sub{opacity:.7;margin:0}.code{white-space:pre-wrap;background:#f4f4f8;border-radius:14px;padding:18px;font:17px Consolas,monospace;margin:20px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{border:0;border-radius:14px;padding:18px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;color:white;min-height:65px}
.answer:nth-child(1){background:#d93838}.answer:nth-child(2){background:#167fc4}.answer:nth-child(3){background:#c99800}.answer:nth-child(4){background:#28a745}
.answer:hover{filter:brightness(1.08);transform:translateY(-1px)}.answer:disabled{cursor:default;opacity:.72}
.answer.correct{outline:5px solid #20d86b;opacity:1}.answer.wrong{outline:5px solid #ff5a5a;opacity:1}
.explain{margin-top:16px;padding:14px;background:#eef1ff;border-radius:12px;display:none}.next{display:none;margin-top:16px;border:0;background:#26283f;color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;cursor:pointer}
.start{text-align:center;padding:35px 10px}.start button,.restart{border:0;background:#6747e8;color:#fff;padding:15px 26px;border-radius:13px;font-size:17px;font-weight:800;cursor:pointer}
.progress{height:8px;background:#ffffff20;border-radius:10px;overflow:hidden;margin-bottom:18px}.bar{height:100%;background:#8c72ff;width:0}
.result{text-align:center}.big{font-size:60px;font-weight:900;margin:15px 0}.small{opacity:.7}
@media(max-width:650px){.answers{grid-template-columns:1fr}.card{padding:18px}.wrap{padding:18px 10px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="badge">⚡ JS praktika</div><div class="score" id="score">0 / 0</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card" id="app"></div>
</div>
<script>
const questions = [
{q:"Ką išves šis kodas?",code:"console.log(\"7\" + 3);",a:['10','"73"','NaN','"10"'],c:1,e:'Su + operatoriumi skaičius prijungiamas prie string kaip tekstas.'},
{q:"Ką išves šis kodas?",code:"let taskai = 8;\nif (true) {\n  let taskai = 20;\n}\nconsole.log(taskai);",a:['20','8','undefined','ReferenceError'],c:1,e:'Vidinis let galioja tik if bloke, todėl išorėje lieka 8.'},
{q:"Ką išves do...while?",code:"let n = 4;\ndo {\n  n += 2;\n} while (false);\nconsole.log(n);",a:['4','6','2','Ciklas nesibaigs'],c:1,e:'do blokas visada įvykdomas bent vieną kartą.'},
{q:"Kuri reikšmė yra falsy?",code:"if (REIKŠMĖ) { ... }",a:['"false"','[]','1','0'],c:3,e:'Skaičius 0 JavaScript sąlygoje yra falsy.'},
{q:"Ką išves arrow funkcija?",code:"const dauginti = (a, b) => a * b;\nconsole.log(dauginti(4, 5));",a:['9','20','45','undefined'],c:1,e:'4 * 5 = 20.'},
{q:"Ką išves šis kodas?",code:"const miestai = [\"Vilnius\"];\nmiestai.push(\"Kaunas\");\nmiestai.push(\"Alytus\");\nconsole.log(miestai.length);",a:['1','2','3','4'],c:2,e:'Po dviejų push masyve yra 3 elementai.'},
{q:"Ką grąžins map?",code:"const x = [2, 4, 6];\nconsole.log(x.map(n => n + 1));",a:['[3,5,7]','[2,4,6,1]','13','[1,1,1]'],c:0,e:'map kiekvienam elementui pritaiko n + 1.'},
{q:"Ką išves reduce?",code:"const x = [1, 2, 3];\nconst r = x.reduce((sum, n) => sum + n, 5);\nconsole.log(r);",a:['6','11','5','10'],c:1,e:'Pradedame nuo 5: 5+1+2+3 = 11.'},
{q:"Ką išves?",code:"const vardas = \"  Jonas  \";\nconsole.log(vardas.trim().length);",a:['5','7','9','4'],c:0,e:'trim pašalina tarpus, lieka Jonas – 5 simboliai.'},
{q:"Ką išves?",code:"const x = \"raudona|žalia|mėlyna\";\nconsole.log(x.split(\"|\")[1]);",a:['raudona','žalia','mėlyna','undefined'],c:1,e:'split sukuria masyvą, o indeksas 1 yra antras elementas.'},
{q:"Ką išves switch?",code:"let r = \"\";\nswitch (2) {\n case 1: r += \"X\"; break;\n case 2: r += \"Y\";\n case 3: r += \"Z\"; break;\n}\nconsole.log(r);",a:['"Y"','"YZ"','"XYZ"','"Z"'],c:1,e:'case 2 neturi break, todėl vykdomas ir case 3.'},
{q:"Ką išves?",code:"const originalas = [4, 5];\nconst kopija = [...originalas];\nkopija[0] = 99;\nconsole.log(originalas[0]);",a:['99','4','5','undefined'],c:1,e:'Spread sukuria atskirą masyvo kopiją.'},
{q:"Ką išves?",code:"const zmogus = { vardas: \"Matas\", amzius: 21 };\nconst naujas = { ...zmogus, amzius: 22 };\nconsole.log(naujas.amzius);",a:['21','22','undefined','2'],c:1,e:'Vėliau nurodyta amzius reikšmė perrašo nukopijuotą.'},
{q:"Kuris teiginys apie Date.now() teisingas?",code:"const laikas = Date.now();",a:['Grąžina Date objektą','Grąžina metus','Grąžina milisekundžių skaičių','Grąžina sekundes nuo šiandienos'],c:2,e:'Date.now() grąžina milisekundžių skaičių nuo Unix epoch.'},
{q:"Kaip rasti šį elementą pagal id?",code:"<div id=\"rezultatas\">10</div>",a:['document.getElementById("rezultatas")','document.getElementById(".rezultatas")','document.querySelector("rezultatas")','document.findId("rezultatas")'],c:0,e:'getElementById naudojamas su ID tekstu be #.'},
{q:"Kuris querySelector variantas ras elementą pagal klasę?",code:"<p class=\"info\">Tekstas</p>",a:['document.querySelector("#info")','document.querySelector("info")','document.querySelector(".info")','document.querySelector("@info")'],c:2,e:'CSS klasės selektorius prasideda tašku.'},
{q:"Kaip pridėti naują li elementą į ul?",code:"const li = document.createElement(\"li\");\nconst ul = document.querySelector(\"ul\");",a:['ul.appendChild(li)','li.appendChild(ul)','document.appendChild(ul)','ul.createElement(li)'],c:0,e:'Tėviniam elementui kviečiamas appendChild su vaiku.'},
{q:"Kaip pakeisti elemento teksto spalvą?",code:"const el = document.querySelector(\"p\");",a:['el.color = "blue"','el.style.color = "blue"','el.textColor("blue")','el.style = color.blue'],c:1,e:'CSS color savybė keičiama per element.style.color.'},
{q:"Ką event.currentTarget dažniausiai nurodo?",code:"btn.addEventListener(\"click\", event => console.log(event.currentTarget));",a:['Elementą, kuriam vykdomas listeneris','Pelės koordinates','Elemento tekstą','Visada document'],c:0,e:'currentTarget yra elementas, prie kurio prijungtas dabartinis event listener.'},
{q:"Kuri savybė grąžina ankstesnį gretimą HTML elementą?",code:"elementas.???",a:['previousElementSibling','previousNode','parentElementSibling','firstElementChild'],c:0,e:'previousElementSibling grąžina ankstesnį sibling elementą.'},
{q:"Ką išves template literal?",code:"const kiekis = 3;\nconsole.log(`Turiu ${kiekis} obuolius`);",a:['Turiu kiekis obuolius','Turiu 3 obuolius','Turiu ${kiekis} obuolius','3'],c:1,e:'${kiekis} pakeičiamas kintamojo reikšme.'},
{q:"Ką grąžins typeof?",code:"console.log(typeof 42);",a:['"string"','"integer"','"number"','"float"'],c:2,e:'JavaScript sveikieji ir dešimtainiai skaičiai yra number.'},
{q:"Ką išves?",code:"console.log(10 !== \"10\");",a:['true','false','undefined','10'],c:0,e:'!== tikrina ir tipą, todėl number 10 ir string "10" nėra vienodi.'},
{q:"Ką išves?",code:"const a = [\"A\", \"B\", \"C\", \"D\"];\nconsole.log(a[2]);",a:['A','B','C','D'],c:2,e:'Indeksai prasideda nuo 0, todėl [2] yra trečias elementas.'},
{q:"Ką išves ciklas?",code:"let suma = 0;\nfor (let i = 0; i < 4; i++) {\n  suma += 2;\n}\nconsole.log(suma);",a:['4','6','8','10'],c:2,e:'Ciklas vyksta 4 kartus, kiekvieną kartą prideda 2.'},
{q:"Ką grąžins filter?",code:"const a = [3, 8, 1, 10];\nconsole.log(a.filter(x => x >= 8));",a:['[3,1]','[8,10]','[10]','[3,8,10]'],c:1,e:'Lieka reikšmės, kurios yra 8 arba didesnės.'},
{q:"Ką išves?",code:"const masina = { marke: \"Volvo\" };\nconsole.log(masina.spalva);",a:['null','""','undefined','ReferenceError'],c:2,e:'Neegzistuojanti objekto savybė yra undefined.'},
{q:"Ką padaro shift()?",code:"const a = [10, 20, 30];\na.shift();\nconsole.log(a);",a:['[10,20]','[20,30]','[10,20,30]','[30]'],c:1,e:'shift pašalina pirmą masyvo elementą.'},
{q:"Ką išves?",code:"console.log(Boolean(\"labas\"));",a:['true','false','undefined','"labas"'],c:0,e:'Netuščias string yra truthy.'},
{q:"Ką išves?",code:"console.log(3 ** 2);",a:['6','9','8','32'],c:1,e:'3 pakelta kvadratu yra 9.'},
{q:"Kuris kodas sukuria button elementą?",code:"// pasirink teisingą",a:['document.createElement("button")','document.getElement("button")','document.new("button")','document.makeElement(button)'],c:0,e:'Naujas DOM elementas kuriamas createElement.'},
{q:"Ką išves?",code:"const tekstas = \"mokausi\";\nconsole.log(tekstas.length);",a:['6','7','8','undefined'],c:1,e:'Žodis mokausi turi 7 simbolius.'},
{q:"Ką išves?",code:"let x = 10;\nx--;\nx--;\nconsole.log(x);",a:['8','9','10','12'],c:0,e:'Du kartus sumažinus po vieną, 10 tampa 8.'},
{q:"Ar galima keisti const objekto savybę?",code:"const user = { level: 1 };\nuser.level = 2;\nconsole.log(user.level);",a:['Ne, bus TypeError','Taip, išves 2','Išves 1','Bus undefined'],c:1,e:'const saugo objekto nuorodą; jo vidines savybes keisti galima.'},
{q:"Kuris metodas paverčia tekstą mažosiomis raidėmis?",code:"\"LABAS\".???()",a:['toLowerCase','lower','toSmallCase','trim'],c:0,e:'toLowerCase() paverčia raides mažosiomis.'},
{q:"Ką išves?",code:"console.log(5 == \"5\");",a:['true','false','TypeError','undefined'],c:0,e:'== atlieka tipo konversiją, todėl šiuo atveju reikšmės laikomos lygiomis.'},
{q:"Ką išves?",code:"const a = [\"x\",\"y\"];\nconsole.log(a.includes(\"z\"));",a:['true','false','undefined','z'],c:1,e:'Masyve z nėra, todėl includes grąžina false.'},
{q:"Kaip teisingai klausytis input įvykio?",code:"const input = document.querySelector(\"input\");",a:['input.addEventListener("input", () => {})','input.listen("input")','input.eventInput()','document.input(input)'],c:0,e:'Įvykiai registruojami addEventListener.'},
{q:"Ką išves destructuring?",code:"const [pirmas, antras] = [\"JS\", \"HTML\"];\nconsole.log(pirmas);",a:['HTML','JS','["JS","HTML"]','undefined'],c:1,e:'Pirmas kintamasis gauna pirmą masyvo elementą.'}
];

let order=[], pos=0, points=0, locked=false;
const app=document.getElementById("app"), score=document.getElementById("score"), bar=document.getElementById("bar");
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){order=shuffle(questions);pos=0;points=0;score.textContent=`0 / ${order.length}`;render()}
function render(){
 locked=false; const x=order[pos]; bar.style.width=`${(pos/order.length)*100}%`;
 app.innerHTML=`<div><div class="small">Klausimas ${pos+1} iš ${order.length}</div><h1>${x.q}</h1><div class="code">${x.code}</div><div class="answers">${x.a.map((v,i)=>`<button class="answer" data-i="${i}">${v}</button>`).join("")}</div><div class="explain" id="explain"></div><button class="next" id="next">${pos===order.length-1?"Rezultatas":"Kitas klausimas →"}</button></div>`;
 document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
 document.getElementById("next").onclick=next;
}
function choose(i){
 if(locked)return;locked=true;const x=order[pos],bs=[...document.querySelectorAll(".answer")];
 bs.forEach(b=>b.disabled=true);bs[x.c].classList.add("correct");if(i!==x.c)bs[i].classList.add("wrong");else points++;
 score.textContent=`${points} / ${order.length}`;
 const ex=document.getElementById("explain");ex.style.display="block";ex.innerHTML=`<b>${i===x.c?"✅ Teisingai!":"❌ Neteisingai."}</b> ${x.e}`;
 document.getElementById("next").style.display="inline-block";
}
function next(){pos++;if(pos<order.length)render();else finish()}
function finish(){
 bar.style.width="100%"; const pct=Math.round(points/order.length*100);
 app.innerHTML=`<div class="result"><div class="small">Testas baigtas</div><div class="big">${points}/${order.length}</div><h1>${pct}%</h1><p>${pct>=80?"Labai gerai 👌":pct>=60?"Neblogai — dar šiek tiek praktikos.":"Pakartok temas ir paleisk testą dar kartą."}</p><button class="restart" onclick="start()">🔄 Bandyti dar kartą</button></div>`;
}
app.innerHTML=`<div class="start"><h1>JavaScript praktikos testas</h1><button onclick="start()">Pradėti testą</button></div>`;
</script></body></html>
