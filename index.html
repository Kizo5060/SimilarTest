<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JavaScript praktikos testas</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#101225,#31246f);color:#fff;min-height:100vh}
.wrap{max-width:920px;margin:auto;padding:30px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.badge,.counter{background:#ffffff18;border:1px solid #ffffff22;padding:10px 16px;border-radius:22px}.bar{height:8px;background:#ffffff22;border-radius:20px;overflow:hidden;margin-bottom:18px}.fill{height:100%;width:0;background:#fff;transition:.2s}
.card{background:#fff;color:#17172b;border-radius:22px;padding:28px;box-shadow:0 18px 55px #0005}.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.level{border:0;border-radius:16px;padding:22px;font-size:20px;font-weight:700;cursor:pointer}.level small{display:block;font-size:13px;font-weight:400;margin-top:6px}
.beginner{background:#dff7e8}.medium{background:#dcecff}.hard{background:#ffe7c7}.master{background:#f3d8ff}
pre{background:#17172b;color:#f4f4ff;padding:18px;border-radius:14px;overflow:auto;font-size:16px;white-space:pre-wrap}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.ans{border:0;border-radius:14px;padding:18px;font-size:16px;font-weight:700;cursor:pointer;background:#ececf4}.ans:hover{transform:translateY(-1px)}
.correct{background:#b9efc8!important}.wrong{background:#ffc2c2!important}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.btn{border:0;background:#5f43e9;color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;cursor:pointer}.hidden{display:none}
.result{text-align:center}.score{font-size:54px;font-weight:800;margin:15px}.masterTitle{font-weight:900}
@media(max-width:650px){.answers,.levels{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="badge">⚡ JS praktika</div><div class="counter" id="counter">Pasirink lygį</div></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="card">
<section id="menu">
<h1>Pasirink sudėtingumo lygį</h1>
<div class="levels">
<button class="level beginner" onclick="start('Beginner')">Beginner<small>JS pagrindai</small></button>
<button class="level medium" onclick="start('Medium')">Medium<small>Masyvai, objektai, funkcijos, DOM</small></button>
<button class="level hard" onclick="start('Hard')">Hard<small>Scopes, references, coercion, metodų grandinės</small></button>
<button class="level master" onclick="start('Master')">Master<small>Closures, event loop, promises, async ir JS keistenybės</small></button>
</div>
</section>
<section id="quiz" class="hidden">
<div id="lvl"></div><h2 id="question"></h2><pre id="code"></pre><div class="answers" id="answers"></div>
<div class="controls"><button class="btn" onclick="menu()">← Lygiai</button><button id="next" class="btn hidden" onclick="next()">Kitas →</button></div>
</section>
<section id="result" class="hidden result"><h1 id="resultTitle"></h1><div class="score" id="score"></div><p id="resultText"></p><button class="btn" onclick="menu()">Rinktis kitą lygį</button> <button class="btn" onclick="restart()">Kartoti</button></section>
</div></div>

onst s = \"JavaScript\";\nconsole.log(s.slice(4,10));", "a": ["\"Script\"", "\"Java\"", "\"Script!\"", "\"aScrip\""], "correct": 0}, {"level": "Hard", "q": "Ką išves?", "code": "let a = 1;\nlet b = a++;\nlet c = ++a;\nconsole.log(a,b,c);", "a": ["3 1 3", "3 2 3", "2 1 2", "3 1 2"], "correct": 0}, {"level": "Hard", "q": "Ką išves?", "code": "console.log(typeof null, typeof [], Array.isArray([]));", "a": ["\"object\" \"object\" true", "\"null\" \"array\" true", "\"object\" \"array\" true", "\"null\" \"object\" false"], "correct": 0}, {"level": "Master", "q": "Kokia tiksli išvedimo tvarka?", "code": "console.log(\"A\");\nsetTimeout(() => console.log(\"B\"), 0);\nPromise.resolve().then(() => console.log(\"C\"));\nconsole.log(\"D\");", "a": ["A D C B", "A B C D", "A D B C", "A C D B"], "correct": 0}, {"level": "Master", "q": "Ką išves?", "code": "let x = 1;\nfunction outer() {\n let x = 2;\n return function() {\n   console.log(x++);\n };\n}\nconst f = outer();\nf();\nf();\nconsole.log(x);", "a": ["2, 3, 1", "2, 2, 1", "1, 2, 3", "2, 3, 4"], "correct": 0}, {"level": "Master", "q": "Ką išves?", "code": "for (var i = 0; i < 3; i++) {\n setTimeout(() => console.log(i), 0);\n}", "a": ["3, 3, 3", "0, 1, 2", "1, 2, 3", "undefined x3"], "correct": 0}, {"level": "Master", "q": "Ką išvestų tas pats ciklas naudojant `let i`?", "code": "for (let i = 0; i < 3; i++) {\n setTimeout(() => console.log(i), 0);\n}", "a": ["0, 1, 2", "3, 3, 3", "1, 2, 3", "0, 0, 0"], "correct": 0}, {"level": "Master", "q": "Ką išves?", "code": "const obj = {\n value: 10,\n normal() { return this.value; },\n arrow: () => this.value\n};\nconsole.log(obj.normal());", "a": ["10", "undefined", "Klaida", "obj"], "correct": 0}, {"level": "Master", "q": "Ką išves?", "code": "const a = NaN;\nconsole.log(a === a, Object.is(a, a));", "a": ["false true", "true true", "false false", "true false"], "correct": 0}, {"level": "Master", "q": "Ką išves?", "code": "console.log(Object.is(0, -0));\nconsole.log(0 === -0);", "a": let current=[], idx=0, score=0, selectedLevel="", locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(level){selectedLevel=level;current=shuffle(QUESTIONS.filter(x=>x.level===level));idx=0;score=0;$("menu").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){locked=false;const q=current[idx];$("counter").textContent=`${idx+1} / ${current.length}`;$("fill").style.width=`${idx/current.length*100}%`;$("lvl").innerHTML=`<b>${q.level}</b>`;$("question").textContent=q.q;$("code").textContent=q.code;$("code").style.display=q.code?"block":"none";$("answers").innerHTML="";$("next").classList.add("hidden");
const mixed=shuffle(q.a.map((t,i)=>({t,i})));mixed.forEach(o=>{const b=document.createElement("button");b.className="ans";b.textContent=o.t;b.onclick=()=>answer(b,o.i,q.correct);$("answers").appendChild(b)})}
function answer(btn,i,correct){if(locked)return;locked=true;document.querySelectorAll(".ans").forEach(b=>b.disabled=true);if(i===correct){score++;btn.classList.add("correct")}else{btn.classList.add("wrong");document.querySelectorAll(".ans").forEach(b=>{if(b.textContent===current[idx].a[correct])b.classList.add("correct")})}$("next").classList.remove("hidden")}
function next(){idx++;if(idx>=current.length)finish();else render()}
